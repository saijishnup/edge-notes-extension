<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Quick Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="header">
    <div class="left-icons">
      <img src="icons/icon128.png" alt="Notes icon" style="width: 24px; height: 24px; top: 0;">
      <h2>Quick Notes</h2>
    </div>

    <div class="right-icons">
      <a href="https://github.com/saijishnup/edge-notes-extension" target="_blank" rel="noopener noreferrer" id="githubLink">
        <img src="icons/github.png" alt="GitHub">
      </a>
        <button id="themeToggle" type="button" aria-label="Toggle theme">🌗</button>
    </div>
  </div>

  <textarea id="noteInput" placeholder="Write something..."></textarea>

  <button id="addNote">Add</button>


  <div class="toggle-bar" id="toggleNotes">
    Recent Notes ⬇
  </div>

  <ul id="notesList" class="hidden"></ul>


  </div>

<!-- Modal -->
<div id="editorModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Edit note">
  <div class="modal-content">
    <textarea id="editArea"></textarea>

    <div class="modal-actions">
      <button id="saveEdit">Save</button>
      <button id="copyNote">Copy</button>
      <button id="closeModal">Close</button>
    </div>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
